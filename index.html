<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Fight 2D</title>
  <style>
    :root{
      --bg1:#0b0f19;
      --bg2:#101a33;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf0ff;
      --muted: rgba(234,240,255,.78);
      --shadow: 0 16px 50px rgba(0,0,0,.45);
      --good:#54ffa6;
      --bad:#ff5b7a;
      --accent:#7aa2ff;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1100px 700px at 20% 10%, var(--bg2), var(--bg1));
    }
    header{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:14px; padding:12px 14px;
      border-bottom:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    }
    .col{ display:flex; flex-direction:column; gap:6px; }
    .right{ align-items:flex-end; text-align:right; }
    .line{ font-size:14px; }
    .small{ font-size:12px; color:var(--muted); line-height:1.25; max-width: 760px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    button, select{
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      color:var(--text);
      padding:9px 10px;
      border-radius:12px;
      cursor:pointer;
    }
    button:hover, select:hover{ background: rgba(255,255,255,.12); }
    button.ghost{ background: rgba(255,255,255,.05); }
    button.warn{ border-color: rgba(255,194,74,.26); background: rgba(255,194,74,.14); }
    main{ display:grid; place-items:center; padding:14px; gap:10px; }
    canvas{
      width:min(960px, 96vw);
      height:auto;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:#111827;
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }
    .tap{
      font-size:12px; color:var(--muted);
      border:1px dashed rgba(255,255,255,.18);
      padding:10px 12px;
      border-radius:999px;
      user-select:none;
      text-align:center;
      max-width:min(960px, 96vw);
    }
    .mobile{
      width:min(960px, 96vw);
      display:flex; justify-content:space-between; gap:10px;
      margin-top: 6px;
    }
    .pad{
      display:flex; gap:8px; flex-wrap:wrap;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      padding:10px;
      border-radius:16px;
    }
    .pad button{ min-width:64px; font-weight:800; }
    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size:12px;
    }
    .statusbar{
      width:min(960px, 96vw);
      display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="col">
      <div class="line"><b>Você:</b> <span id="pName">-</span> <span class="pill" id="pPick"></span></div>
      <div class="line"><b>CPU:</b> <span id="eName">-</span> <span class="pill" id="ePick"></span></div>
      <div class="small" id="rosterLine">Elenco (1–5): -</div>
      <div class="small">
        <b>PC (teclado)</b>: A/D mover • W pular • J soco • K chute • R revanche • 1–5 troca personagem<br/>
        <b>Celular</b>: use os botões na tela (abaixo do jogo).
      </div>
    </div>

    <div class="col right">
      <div class="line">
        <b>Arena:</b>
        <select id="arenaSelect"></select>
      </div>

      <div class="row">
        <button id="rematchBtn">Revanche (R)</button>
        <button id="newRosterBtn" class="ghost">Novo elenco (5 aleatórios)</button>
      </div>

      <div class="row">
        <button id="soundBtn" class="ghost">Som: OFF</button>
      </div>
    </div>
  </header>

  <main>
    <div class="statusbar">
      <div class="pill" id="arenaPill">Arena: -</div>
      <div class="pill" id="hintPill">Dica: troque personagem com 1–5</div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div id="tapToSound" class="tap">Para tocar música: clique em “Som: OFF” (o navegador bloqueia autoplay).</div>

    <div class="mobile" aria-label="Controles mobile">
      <div class="pad">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
        <button id="btnJump" class="ghost">PULAR</button>
      </div>
      <div class="pad">
        <button id="btnPunch">SOCO</button>
        <button id="btnKick" class="warn">CHUTE</button>
      </div>
    </div>
  </main>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const pNameEl = document.getElementById("pName");
  const eNameEl = document.getElementById("eName");
  const pPickEl = document.getElementById("pPick");
  const ePickEl = document.getElementById("ePick");

  const rosterLineEl = document.getElementById("rosterLine");
  const arenaSelect = document.getElementById("arenaSelect");
  const arenaPill = document.getElementById("arenaPill");

  const rematchBtn = document.getElementById("rematchBtn");
  const newRosterBtn = document.getElementById("newRosterBtn");

  const soundBtn = document.getElementById("soundBtn");
  const tapToSound = document.getElementById("tapToSound");

  // mobile buttons
  const btnLeft = document.getElementById("btnLeft");
  const btnRight = document.getElementById("btnRight");
  const btnJump = document.getElementById("btnJump");
  const btnPunch = document.getElementById("btnPunch");
  const btnKick = document.getElementById("btnKick");

  const keys = new Set();
  const hold = { left:false, right:false, jump:false, punch:false, kick:false };

  addEventListener("keydown", (e) => {
    keys.add(e.key.toLowerCase());

    if (["1","2","3","4","5"].includes(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      if (roster[idx]) setPlayerChar(idx);
    }
    if (e.key.toLowerCase() === "r") resetRound(true);
  });
  addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

  function bindHold(btn, prop){
    const on = () => hold[prop] = true;
    const off = () => hold[prop] = false;
    btn.addEventListener("pointerdown", (e)=>{ e.preventDefault(); on(); });
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("pointerleave", off);
  }
  bindHold(btnLeft, "left");
  bindHold(btnRight, "right");
  bindHold(btnJump, "jump");
  bindHold(btnPunch, "punch");
  bindHold(btnKick, "kick");

  // ====== CONFIG ======
  const GROUND_Y = 455;
  const GRAVITY = 0.8;

  const arenas = [
    { name:"Cidade",   sky1:"#0b1020", sky2:"#1a2b5a", ground:"#1b253a", accent:"#7aa2ff" },
    { name:"Dojo",     sky1:"#160b12", sky2:"#3a1020", ground:"#2b1b25", accent:"#ff8ab6" },
    { name:"Floresta", sky1:"#071b12", sky2:"#0f3a25", ground:"#0b2a1b", accent:"#75ffad" },
  ];

  // Lista maior -> sorteia 5
  const ALL_CHARS = [
    { name:"Goku", color:"#ffb020", speed:4.2, jump:14.5, punch:12, kick:16 },
    { name:"Naruto", color:"#ff7a00", speed:4.6, jump:14.0, punch:10, kick:18 },
    { name:"Luffy", color:"#e23d3d", speed:4.1, jump:15.2, punch:13, kick:15 },
    { name:"Ichigo", color:"#f0f0f0", speed:4.0, jump:14.8, punch:14, kick:14 },
    { name:"Saitama", color:"#ffe100", speed:3.9, jump:13.8, punch:18, kick:20 },
    { name:"Gojo", color:"#7ee0ff", speed:4.3, jump:14.6, punch:13, kick:17 },
    { name:"Tanjiro", color:"#6bff9a", speed:4.2, jump:14.9, punch:12, kick:18 },
    { name:"Levi", color:"#c0c7d3", speed:4.8, jump:15.0, punch:11, kick:17 },
    { name:"Deku", color:"#58ffa7", speed:4.4, jump:14.7, punch:13, kick:16 },
    { name:"Sukuna", color:"#ff4e74", speed:4.1, jump:14.2, punch:15, kick:18 },
    { name:"Gon", color:"#7dff51", speed:4.5, jump:14.4, punch:12, kick:16 },
    { name:"Eren", color:"#b58b6b", speed:4.0, jump:14.1, punch:14, kick:16 },
  ];

  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let arenaIndex = 0;
  let roster = [];
  function rebuildRoster(){
    roster = shuffle(ALL_CHARS).slice(0,5);
    rosterLineEl.textContent = "Elenco (1–5): " + roster.map((c,i)=>`${i+1}:${c.name}`).join(" • ");
  }

  function populateArenaSelect(){
    arenaSelect.innerHTML = "";
    arenas.forEach((a, i)=>{
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = a.name;
      arenaSelect.appendChild(opt);
    });
    arenaSelect.value = String(arenaIndex);
  }
  arenaSelect.addEventListener("change", ()=>{
    arenaIndex = parseInt(arenaSelect.value, 10);
  });

  // ====== ÁUDIO (gerado no navegador) ======
  let soundOn = false;
  let audioCtx = null;
  let master = null;
  let musicTimer = null;

  function tone(freq, dur=0.10, type="square", gain=0.03){
    if (!audioCtx || !master) return;
    const t = audioCtx.currentTime;

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.connect(g);
    g.connect(master);

    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function sfxHit(){
    tone(180, 0.05, "sawtooth", 0.05);
    tone(90, 0.06, "square", 0.03);
  }
  function sfxJump(){
    tone(520, 0.06, "square", 0.02);
    tone(720, 0.05, "square", 0.015);
  }

  function startMusic(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (!master){
      master = audioCtx.createGain();
      master.gain.value = 0.6;
      master.connect(audioCtx.destination);
    }
    const scale = [0, 3, 5, 7, 10]; // pentatônica
    let step = 0;
    if (musicTimer) clearInterval(musicTimer);

    musicTimer = setInterval(() => {
      if (!soundOn) return;
      const root = 220; // A3
      const n = scale[step % scale.length];
      const octave = (step % 10 < 5) ? 1 : 2;
      const freq = root * Math.pow(2, (n/12)) * octave;
      tone(freq, 0.09, "square", 0.018);
      if (step % 4 === 0) tone(freq/2, 0.08, "triangle", 0.02);
      step++;
    }, 120);
  }

  function stopMusic(){
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function setSound(on){
    soundOn = on;
    if (soundOn){
      tapToSound.style.display = "none";
      soundBtn.textContent = "Som: ON";
      startMusic();
    } else {
      soundBtn.textContent = "Som: OFF";
      tapToSound.style.display = "";
      stopMusic();
    }
  }

  soundBtn.addEventListener("click", async () => {
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume().catch(()=>{});
      master = audioCtx.createGain();
      master.gain.value = 0.7;
      master.connect(audioCtx.destination);
    }
    setSound(!soundOn);
  });

  // ====== FIGHTER ======
  class Fighter{
    constructor(x, facing, rosterIndex, isCPU){
      this.x = x; this.y = GROUND_Y;
      this.vx = 0; this.vy = 0;
      this.w = 48; this.h = 92;
      this.facing = facing;
      this.isCPU = isCPU;
      this.rosterIndex = rosterIndex;
      this.char = roster[rosterIndex];
      this.hp = 100;
      this.onGround = true;
      this.attack = null; // {type,t,dur,activeFrom,activeTo,didHit}
      this.cooldown = 0;
      this.hitstun = 0;
    }
    setChar(rosterIdx){
      this.rosterIndex = rosterIdx;
      this.char = roster[rosterIdx];
    }
    rect(){ return { x:this.x - this.w/2, y:this.y - this.h, w:this.w, h:this.h }; }
    startAttack(type){
      if (this.cooldown > 0 || this.hitstun > 0 || this.attack) return;
      const dur = type === "punch" ? 18 : 24;
      this.attack = {
        type, t:0, dur,
        activeFrom: type === "punch" ? 6 : 8,
        activeTo: type === "punch" ? 10 : 14,
        didHit:false
      };
      this.cooldown = type === "punch" ? 16 : 22;
    }
    attackDamage(){ return this.attack?.type === "punch" ? this.char.punch : this.char.kick; }
    attackHitbox(){
      const range  = this.attack?.type === "punch" ? 46 : 62;
      const height = this.attack?.type === "punch" ? 34 : 44;
      const y = this.y - 62;
      const x = this.x + this.facing * (this.w/2 + range/2);
      return { x: x - range/2, y: y - height/2, w: range, h: height };
    }
    applyHit(dmg, attackerFacing){
      this.hp = clamp(this.hp - dmg, 0, 100);
      this.hitstun = 10;
      this.vx += (attackerFacing * 2.6);
      if (soundOn) sfxHit();
    }
    updateTimers(){
      if (this.cooldown > 0) this.cooldown--;
      if (this.hitstun > 0) this.hitstun--;
      if (this.attack){
        this.attack.t++;
        if (this.attack.t >= this.attack.dur) this.attack = null;
      }
    }
    updatePhysics(){
      this.vx *= this.onGround ? 0.86 : 0.98;
      this.vy += GRAVITY;
      this.x += this.vx;
      this.y += this.vy;
      if (this.y >= GROUND_Y){
        this.y = GROUND_Y; this.vy = 0; this.onGround = true;
      } else this.onGround = false;
      this.x = clamp(this.x, 40, canvas.width - 40);
    }
  }

  function overlap(a,b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  let player, enemy;

  function pickTwoDifferentIndices(){
    const a = randInt(0, roster.length-1);
    let b = randInt(0, roster.length-1);
    while(b === a) b = randInt(0, roster.length-1);
    return [a,b];
  }

  function setPlayerChar(idx){
    // não deixar player e cpu iguais
    player.setChar(idx);
    if (enemy.rosterIndex === idx){
      let other = randInt(0, roster.length-1);
      while(other === idx) other = randInt(0, roster.length-1);
      enemy.setChar(other);
    }
    syncNames();
  }

  function syncNames(){
    pNameEl.textContent = player.char.name;
    eNameEl.textContent = enemy.char.name;
    pPickEl.textContent = `#${player.rosterIndex+1}`;
    ePickEl.textContent = `#${enemy.rosterIndex+1}`;
  }

  function resetRound(randomizeFighters=false){
    if (randomizeFighters){
      const [pi, ei] = pickTwoDifferentIndices();
      player.setChar(pi);
      enemy.setChar(ei);
    }

    player.x = 260; player.y = GROUND_Y; player.vx = 0; player.vy = 0;
    enemy.x  = 700; enemy.y  = GROUND_Y; enemy.vx  = 0; enemy.vy  = 0;
    player.hp = 100; enemy.hp = 100;
    player.attack=null; enemy.attack=null;
    player.cooldown=0; enemy.cooldown=0;
    player.hitstun=0; enemy.hitstun=0;

    arenaIndex = randInt(0, arenas.length-1);
    arenaSelect.value = String(arenaIndex);

    syncNames();
  }

  rematchBtn.addEventListener("click", ()=> resetRound(true));
  newRosterBtn.addEventListener("click", ()=>{
    rebuildRoster();
    resetRound(true);
  });

  // ===== Player / AI =====
  function wantLeft(){ return keys.has("a") || hold.left; }
  function wantRight(){ return keys.has("d") || hold.right; }
  function wantJump(){ return keys.has("w") || hold.jump; }
  function wantPunch(){ return keys.has("j") || hold.punch; }
  function wantKick(){ return keys.has("k") || hold.kick; }

  function updatePlayer(){
    player.facing = (enemy.x > player.x) ? 1 : -1;
    if (player.hitstun > 0) return;

    let dir = 0;
    if (wantLeft()) dir -= 1;
    if (wantRight()) dir += 1;
    player.vx += dir * (player.char.speed * 0.85);

    if (wantJump() && player.onGround){
      player.vy = -player.char.jump;
      if (soundOn) sfxJump();
    }
    if (wantPunch()) player.startAttack("punch");
    if (wantKick()) player.startAttack("kick");
  }

  let aiJumpCd = 0;
  function updateAI(){
    if (aiJumpCd > 0) aiJumpCd--;
    enemy.facing = (player.x > enemy.x) ? 1 : -1;
    if (enemy.hitstun > 0) return;

    const dist = Math.abs(player.x - enemy.x);

    if (dist > 130) enemy.vx += enemy.facing * 1.9;
    else if (dist < 90) enemy.vx -= enemy.facing * 1.1;

    if (dist < 115 && enemy.cooldown <= 0 && !enemy.attack){
      enemy.startAttack(Math.random() < 0.6 ? "punch" : "kick");
    }

    if (enemy.onGround && aiJumpCd <= 0 && dist < 220 && Math.random() < 0.015){
      enemy.vy = -enemy.char.jump;
      aiJumpCd = 90;
    }
  }

  function resolveAttack(attacker, defender){
    if (!attacker.attack) return;
    const t = attacker.attack.t;
    if (t < attacker.attack.activeFrom || t > attacker.attack.activeTo) return;
    if (attacker.attack.didHit) return;

    const hb = attacker.attackHitbox();
    const dr = defender.rect();
    if (overlap(hb, dr)){
      attacker.attack.didHit = true;
      defender.applyHit(attacker.attackDamage(), attacker.facing);
    }
  }

  // ===== Draw =====
  function drawArena(){
    const a = arenas[arenaIndex];
    arenaPill.textContent = `Arena: ${a.name}`;

    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0, a.sky2);
    g.addColorStop(1, a.sky1);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = a.accent;
    for(let i=0;i<10;i++){
      const w = 50 + (i%3)*35;
      const h = 80 + (i%5)*26;
      const x = 50 + i*90;
      const y = GROUND_Y - h;
      ctx.fillRect(x, y, w, h);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = a.ground;
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y+0.5);
    ctx.lineTo(canvas.width, GROUND_Y+0.5);
    ctx.stroke();
  }

  function drawBars(){
    const pad = 16;
    const barW = 360, barH = 16;

    function bar(x,y,val,color){
      ctx.fillStyle = "rgba(255,255,255,.10)";
      ctx.fillRect(x,y,barW,barH);
      ctx.fillStyle = color;
      ctx.fillRect(x,y,barW*(val/100),barH);
      ctx.strokeStyle = "rgba(255,255,255,.22)";
      ctx.strokeRect(x,y,barW,barH);
    }

    bar(pad, pad, player.hp, "#54ffa6");
    bar(canvas.width - pad - barW, pad, enemy.hp, "#ff5b7a");

    ctx.fillStyle = "rgba(255,255,255,.88)";
    ctx.font = "14px system-ui, Arial";
    ctx.fillText(player.char.name, pad, pad + 38);
    ctx.textAlign = "right";
    ctx.fillText(enemy.char.name, canvas.width - pad, pad + 38);
    ctx.textAlign = "left";
  }

  function drawFighter(f){
    const r = f.rect();

    ctx.fillStyle = f.char.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);

    // “face”
    ctx.fillStyle = "rgba(0,0,0,.35)";
    const eyeX = (f.facing === 1) ? r.x + 30 : r.x + 8;
    ctx.fillRect(eyeX, r.y + 18, 10, 6);

    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    if (f.attack){
      const t = f.attack.t;
      if (t >= f.attack.activeFrom && t <= f.attack.activeTo){
        const hb = f.attackHitbox();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawEnd(){
    if (player.hp > 0 && enemy.hp > 0) return;

    const win = enemy.hp <= 0 && player.hp > 0;
    const text = win ? "VOCÊ VENCEU!" : (player.hp <= 0 && enemy.hp <= 0 ? "EMPATE!" : "VOCÊ PERDEU!");

    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "bold 44px system-ui, Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, canvas.width/2, canvas.height/2 - 10);

    ctx.font = "16px system-ui, Arial";
    ctx.fillText("Aperte R ou clique em Revanche", canvas.width/2, canvas.height/2 + 28);
    ctx.textAlign = "left";
  }

  function loop(){
    const ended = (player.hp <= 0 || enemy.hp <= 0);

    if (!ended){
      updatePlayer();
      updateAI();

      player.updateTimers();
      enemy.updateTimers();

      player.updatePhysics();
      enemy.updatePhysics();

      resolveAttack(player, enemy);
      resolveAttack(enemy, player);
    }

    drawArena();
    drawBars();
    drawFighter(player);
    drawFighter(enemy);
    drawEnd();

    requestAnimationFrame(loop);
  }

  // ===== Init =====
